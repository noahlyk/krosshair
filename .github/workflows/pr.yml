name: Build to test PR

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm base-devel vulkan-headers vulkan-icd-loader libx11 libgl git flatpak-builder flatpak
      - uses: actions/checkout@v5
      - name: Enable Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build binary
        run: make release
      - name: Build flatpak
        run: make flatpak-build
      - name: Create tarball
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH_NAME="x86_64"
          elif [ "$ARCH" = "aarch64" ]; then
            ARCH_NAME="aarch64"
          fi
          mkdir -p krosshair-linux-${ARCH_NAME}
          cp lib/krosshair.so krosshair-linux-${ARCH_NAME}/
          cp krosshair.json krosshair-linux-${ARCH_NAME}/
          cp LICENSE krosshair-linux-${ARCH_NAME}/ 2>/dev/null || true
          tar -czf krosshair-linux-${ARCH_NAME}.tar.gz -C krosshair-linux-${ARCH_NAME} .
      - name: Generate checksum
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH_NAME="x86_64"
          elif [ "$ARCH" = "aarch64" ]; then
            ARCH_NAME="aarch64"
          fi
          sha256sum krosshair-linux-${ARCH_NAME}.tar.gz > krosshair-linux-${ARCH_NAME}.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: krosshair-linux
          path: |
            krosshair-linux-*.tar.gz
            krosshair-linux-*.sha256
            build/flatpak/*.flatpak
